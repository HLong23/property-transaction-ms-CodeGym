<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết giao dịch</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container py-4" style="max-width: 720px;">
    <h2 class="page-title text-center mb-4">Chi tiết giao dịch</h2>

    <div class="card-box">
        <dl class="row mb-4">
            <dt class="col-sm-4 detail-label">Mã giao dịch</dt>
            <dd class="col-sm-8" th:text="${giaoDich.maGiaoDich}"></dd>

            <dt class="col-sm-4 detail-label">Loại bất động sản</dt>
            <dd class="col-sm-8" th:text="${giaoDich.loaiDichVu}"></dd>

            <dt class="col-sm-4 detail-label">Ngày giao dịch</dt>
            <dd class="col-sm-8" th:text="${#temporals.format(giaoDich.ngayGiaoDich, 'dd/MM/yyyy')}"></dd>

            <dt class="col-sm-4 detail-label">Đơn giá (VND)</dt>
            <dd class="col-sm-8"
                th:text="${#numbers.formatDecimal(giaoDich.donGia, 1, 'POINT', 0, 'COMMA')}"></dd>

            <dt class="col-sm-4 detail-label">Diện tích (m2)</dt>
            <dd class="col-sm-8"
                th:text="${#numbers.formatDecimal(giaoDich.dienTich, 1, 'POINT', 0, 'COMMA')}"></dd>

            <dt class="col-sm-4 detail-label">Tên khách hàng</dt>
            <dd class="col-sm-8" th:text="${giaoDich.khachHang.tenKhachHang}"></dd>

            <dt class="col-sm-4 detail-label">Số điện thoại</dt>
            <dd class="col-sm-8" th:text="${giaoDich.khachHang.soDienThoai}"></dd>

            <dt class="col-sm-4 detail-label">Email</dt>
            <dd class="col-sm-8" th:text="${giaoDich.khachHang.email}"></dd>
        </dl>

        <div class="d-flex gap-2">
            <form th:action="@{/giao-dich/{ma}/delete(ma=${giaoDich.maGiaoDich})}" method="post"
                  th:attr="data-list-url=@{/giao-dich}"
                  onsubmit="if (confirm('Bạn có muốn xóa giao dịch này không?')) { return true; } window.location.href = this.dataset.listUrl; return false;">
                <button type="submit" class="btn btn-warning px-4">Xóa</button>
            </form>
            <a class="btn btn-primary px-4" th:href="@{/giao-dich}">Quay lại</a>
        </div>
    </div>
</div>
</body>
</html>
