<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm mới giao dịch</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container py-4" style="max-width: 720px;">
    <h2 class="page-title text-center mb-4">Thêm mới giao dịch</h2>

    <div class="card-box">
        <form th:action="@{/giao-dich/create}" th:object="${giaoDichDto}" method="post" novalidate>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label" for="maGiaoDich">Mã giao dịch</label>
                <div class="col-sm-8">
                    <input type="text" id="maGiaoDich" class="form-control" th:field="*{maGiaoDich}"
                           th:errorclass="is-invalid" placeholder="MGD-0001">
                    <div class="invalid-feedback" th:errors="*{maGiaoDich}"></div>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label" for="khachHangId">Tên khách hàng</label>
                <div class="col-sm-8">
                    <select id="khachHangId" class="form-select" th:field="*{khachHangId}"
                            th:errorclass="is-invalid">
                        <option value="">Chọn khách hàng</option>
                        <option th:each="k : ${dsKhachHang}" th:value="${k.maKhachHang}"
                                th:text="${k.tenKhachHang}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{khachHangId}"></div>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label">Loại bất động sản</label>
                <div class="col-sm-8 pt-2">
                    <div class="form-check form-check-inline" th:each="l, st : ${dsLoaiDichVu}">
                        <input class="form-check-input" type="radio" th:id="${'loai' + st.index}"
                               th:field="*{loaiDichVu}" th:value="${l}"
                               th:classappend="${#fields.hasErrors('loaiDichVu')} ? 'is-invalid'">
                        <label class="form-check-label" th:for="${'loai' + st.index}" th:text="${l}"></label>
                    </div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('loaiDichVu')}"
                         th:errors="*{loaiDichVu}"></div>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label" for="ngayGiaoDich">Ngày giao dịch</label>
                <div class="col-sm-8">
                    <input type="date" id="ngayGiaoDich" class="form-control" th:field="*{ngayGiaoDich}"
                           th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{ngayGiaoDich}"></div>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label" for="donGia">Đơn giá (VND)</label>
                <div class="col-sm-8">
                    <input type="text" id="donGia" class="form-control" th:field="*{donGia}"
                           th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{donGia}"></div>
                </div>
            </div>

            <div class="row mb-4">
                <label class="col-sm-4 col-form-label" for="dienTich">Diện tích (m2)</label>
                <div class="col-sm-8">
                    <input type="text" id="dienTich" class="form-control" th:field="*{dienTich}"
                           th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{dienTich}"></div>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary px-4">Lưu</button>
                <a class="btn btn-secondary px-4" th:href="@{/giao-dich}">Hủy</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
